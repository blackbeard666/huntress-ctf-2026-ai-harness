---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry
---
apiVersion: v1
kind: Secret
metadata:
  name: telemetry-boot
type: Opaque
data:
  boot.sh: 
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: telemetry-agent
spec:
  selector:
    matchLabels: {app: telemetry}
  template:
    metadata:
      labels: {app: telemetry}
    spec:
      initContainers:
      - name: boot
        image: busybox:1.36
        command: ["/bin/sh", "/boot/boot.sh"]
      containers:
      - name: agent
        image: busybox:1.36
        command:
        - sleep
        - infinity
      volumes:
      - name: host
        hostPath: {path: /}
